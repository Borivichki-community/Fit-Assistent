apiVersion: v1
kind: Service
metadata:
  name: catalog-price-service
  namespace: budget-nutritionist
  labels:
    app: catalog-price-service
    service: catalog
    app.kubernetes.io/name: catalog-price-service
    app.kubernetes.io/part-of: fitassistant
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: 9192
      appProtocol: grpc
    - name: grpc-legacy
      port: 9192
      targetPort: 9192
      appProtocol: grpc
    - name: actuator
      port: 8086
      targetPort: 8086
      appProtocol: http
  selector:
    app: catalog-price-service
