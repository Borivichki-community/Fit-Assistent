apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-price-service-config
  namespace: budget-nutritionist
  labels:
    app: catalog-price-service
    service: catalog
    app.kubernetes.io/name: catalog-price-service
    app.kubernetes.io/part-of: fitassistant
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_GRPC_SERVER_ADDRESS: "0.0.0.0"
  SPRING_GRPC_SERVER_PORT: "9192"
  SERVER_PORT: "8086"
  MANAGEMENT_SERVER_PORT: "8086"
  SPRING_DATA_REDIS_HOST: "redis-cache.budget-nutritionist.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.budget-nutritionist.svc.cluster.local:5432/catalog_db"
  JWK_SET_URI: "http://keycloak.budget-nutritionist.svc.cluster.local:8080/realms/FitAssistant/protocol/openid-connect/certs"
