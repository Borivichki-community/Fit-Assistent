apiVersion: v1
kind: Service
metadata:
  name: diary-service
  namespace: budget-nutritionist
  labels:
    app: diary-service
    service: diary
    app.kubernetes.io/name: diary-service
    app.kubernetes.io/part-of: fitassistant
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9193
      targetPort: 9193
      appProtocol: grpc
    - name: actuator
      port: 8083
      targetPort: 8083
      appProtocol: http
  selector:
    app: diary-service
