apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: diary-grpc-route
  namespace: budget-nutritionist
  labels:
    app.kubernetes.io/name: diary-service
    app.kubernetes.io/part-of: fitassistant
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - method:
            service: com.budgetntr.diary.v1.DiaryService
      backendRefs:
        - name: diary-service
          port: 9193
