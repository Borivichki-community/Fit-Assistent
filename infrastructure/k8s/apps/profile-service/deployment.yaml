apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: budget-nutritionist
  labels:
    app: profile-service
    service: profile
    app.kubernetes.io/name: profile-service
    app.kubernetes.io/part-of: fitassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
        service: profile
        app.kubernetes.io/name: profile-service
        app.kubernetes.io/part-of: fitassistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: profile-service
          image: profile-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: actuator
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: profile-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: profile-service-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: profile-service-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
