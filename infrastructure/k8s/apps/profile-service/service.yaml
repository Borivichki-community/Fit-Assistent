apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: budget-nutritionist
  labels:
    app: profile-service
    service: profile
    app.kubernetes.io/name: profile-service
    app.kubernetes.io/part-of: fitassistant
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      appProtocol: grpc
    - name: actuator
      port: 8080
      targetPort: 8080
      appProtocol: http
  selector:
    app: profile-service
