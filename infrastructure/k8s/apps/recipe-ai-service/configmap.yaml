apiVersion: v1
kind: ConfigMap
metadata:
  name: recipe-ai-service-config
  namespace: budget-nutritionist
  labels:
    app: recipe-ai-service
    service: recipe
    app.kubernetes.io/name: recipe-ai-service
    app.kubernetes.io/part-of: fitassistant
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_GRPC_SERVER_ADDRESS: "0.0.0.0"
  SPRING_GRPC_SERVER_PORT: "9194"
  SERVER_PORT: "8084"
  MANAGEMENT_SERVER_PORT: "8084"
  RECIPE_MANAGEMENT_PORT: "8084"
  RECIPE_CATALOG_TARGET: "catalog-price-service.budget-nutritionist.svc.cluster.local:9192"
  RECIPE_CATALOG_PLAINTEXT: "true"
  RECIPE_DB_URL: "jdbc:postgresql://postgres:5432/recipe_db"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  REDIS_HOST: "redis-cache.budget-nutritionist.svc.cluster.local"
  REDIS_PORT: "6379"
  RECIPE_LLM_MODEL: "gemini-2.5-flash"
  RECIPE_WARMUP_TARGETS: ""
