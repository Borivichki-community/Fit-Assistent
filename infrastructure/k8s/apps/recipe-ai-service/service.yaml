apiVersion: v1
kind: Service
metadata:
  name: recipe-ai-service
  namespace: budget-nutritionist
  labels:
    app: recipe-ai-service
    service: recipe
    app.kubernetes.io/name: recipe-ai-service
    app.kubernetes.io/part-of: fitassistant
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9194
      targetPort: 9194
      appProtocol: grpc
    - name: actuator
      port: 8084
      targetPort: 8084
      appProtocol: http
  selector:
    app: recipe-ai-service
