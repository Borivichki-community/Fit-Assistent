apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: recipe-grpc-route
  namespace: budget-nutritionist
  labels:
    app.kubernetes.io/name: recipe-ai-service
    app.kubernetes.io/part-of: fitassistant
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - method:
            service: com.budgetntr.recipe.v1.RecipeAiService
      backendRefs:
        - name: recipe-ai-service
          port: 9194
