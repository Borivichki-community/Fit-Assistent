# infrastructure/k8s/charts/helmfile.yaml
# Helmfile для декларативного управления установкой Envoy Gateway v1.2.x в кластере Kubernetes
repositories:
  - name: envoy-gateway
    url: https://helm.envoyproxy.io

releases:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    createNamespace: true
    chart: envoy-gateway/gateway-helm
    version: "v1.2.4"
    values:
      - deployment:
          replicas: 1
      - config:
          envoyGateway:
            gateway:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
            rateLimit:
              backend:
                type: Redis
                redis:
                  url: "redis.budget-nutritionist.svc.cluster.local:6379"
