# Самоподписанный TLS-сертификат для терминации HTTPS/TLS на Envoy Gateway
# Домен: api.budget-nutritionist.app
# Альтернативные имена (SAN): localhost, 127.0.0.1, envoy-gateway
#
# Команда для ручной генерации / ротации сертификата:
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt \
#   -subj "/CN=api.budget-nutritionist.app/O=FitAssistant" \
#   -addext "subjectAltName=DNS:api.budget-nutritionist.app,DNS:localhost,DNS:envoy-gateway,IP:127.0.0.1"
#
# kubectl create secret tls profile-gateway-cert \
#   --cert=tls.crt --key=tls.key \
#   --namespace=envoy-gateway-system --dry-run=client -o yaml
