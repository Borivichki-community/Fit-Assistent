# infrastructure/k8s/gateway/06-backend-traffic-policy.yaml
# BackendTrafficPolicy: Двухуровневый Rate Limiting (Local In-Memory + Global Redis)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: profile-rate-limit-policy
  namespace: budget-nutritionist
  labels:
    app.kubernetes.io/name: profile-service
    app.kubernetes.io/part-of: fitassistant
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: profile-grpc-route
  rateLimit:
    type: Global
    # ── 1. Local Rate Limiting (Token Bucket in-memory per Envoy instance) ────────
    # Защита от спама и DoS без сетевых задержек: 20 req/s с burst до 50
    local:
      rules:
        - limit:
            requests: 20
            unit: Second
    # ── 2. Global Rate Limiting (Distributed Redis counter per user) ──────────────
    # Ограничение для авторизованных клиентов: 100 запросов в минуту на каждый x-user-id
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 100
            unit: Minute
---
# Опциональная конфигурация EnvoyProxy для указания Redis бэкенда Rate Limiter
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: profile-gateway-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      rateLimit:
        redis:
          url: "redis.budget-nutritionist.svc.cluster.local:6379"
