apiVersion: v1
kind: Service
metadata:
  name: catalog-price-service
  namespace: budget-nutritionist
spec:
  selector:
    app: catalog-price-service
  ports:
    - name: grpc
      port: 9192
      targetPort: 9192
      appProtocol: grpc
    - name: actuator
      port: 8086
      targetPort: 8086
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: catalog-grpc-route
  namespace: budget-nutritionist
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - method:
            service: com.budgetntr.catalog.v1.CatalogService
      backendRefs:
        - name: catalog-price-service
          port: 9192
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: catalog-jwt-policy
  namespace: budget-nutritionist
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: catalog-grpc-route
  jwt:
    providers:
      - name: keycloak
        issuer: "http://keycloak:8080/realms/FitAssistant"
        remoteJWKS:
          uri: "http://keycloak:8080/realms/FitAssistant/protocol/openid-connect/certs"
        claimToHeaders:
          - claim: sub
            header: x-user-id
          - claim: realm_access.roles
            header: x-user-roles
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: catalog-rate-limit
  namespace: budget-nutritionist
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: catalog-grpc-route
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 100
            unit: Minute
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-gateway-only
  namespace: budget-nutritionist
spec:
  podSelector:
    matchLabels:
      app: catalog-price-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 9192
