# infrastructure/k8s/kind-config.yaml
# Конфигурация кластера kind для локального запуска и верификации Envoy Gateway
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
