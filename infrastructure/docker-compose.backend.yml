x-backend: &backend
  init: true
  pull_policy: build
  healthcheck:
    test:
      - CMD
      - bash
      - -ec
      - exec 3<>/dev/tcp/127.0.0.1/9090
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 12

services:
  profile-service:
    <<: *backend
    image: fitassistant/profile-service:local
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: profile-service
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROFILE_HOST_PORT:-9091}:9090"
    environment:
      SPRING_GRPC_SERVER_ADDRESS: 0.0.0.0
      SPRING_GRPC_SERVER_PORT: "9090"
      PROFILE_DB_URL: jdbc:postgresql://postgres:5432/profile_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  catalog-price-service:
    <<: *backend
    image: fitassistant/catalog-price-service:local
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: catalog-price-service
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CATALOG_HOST_PORT:-9192}:9090"
    environment:
      SPRING_GRPC_SERVER_ADDRESS: 0.0.0.0
      SPRING_GRPC_SERVER_PORT: "9090"
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  diary-service:
    <<: *backend
    image: fitassistant/diary-service:local
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: diary-service
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIARY_HOST_PORT:-9093}:9090"
    environment:
      SPRING_GRPC_SERVER_ADDRESS: 0.0.0.0
      SPRING_GRPC_SERVER_PORT: "9090"
      DIARY_DB_URL: jdbc:postgresql://postgres:5432/diary_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  recipe-ai-service:
    <<: *backend
    image: fitassistant/recipe-ai-service:local
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: recipe-ai-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RECIPE_HOST_PORT:-9094}:9090"
    environment:
      SPRING_GRPC_SERVER_ADDRESS: 0.0.0.0
      SPRING_GRPC_SERVER_PORT: "9090"
      REDIS_HOST: redis
      REDIS_PORT: "6379"

