spring:
  application:
    name: recipe-ai-service

  datasource:
    url: ${RECIPE_DB_URL:jdbc:postgresql://localhost:5433/recipe_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: RecipeAiServiceHikariPool
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: public

  grpc:
    server:
      address: 127.0.0.1
      port: ${RECIPE_GRPC_PORT:9094}
      health:
        enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
      password: ${REDIS_PASSWORD:}

management:
  server:
    port: ${RECIPE_MANAGEMENT_PORT:8084}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis,db

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: recipe-ai-service

recipe:
  catalog-target: ${RECIPE_CATALOG_TARGET:localhost:9192}
  catalog-plaintext: ${RECIPE_CATALOG_PLAINTEXT:false}
  model: ${RECIPE_LLM_MODEL:gemini-2.5-flash}
  llm-api-key: ${RECIPE_LLM_API_KEY:}
  warmup-targets: ${RECIPE_WARMUP_TARGETS:}
  input-usd-per-million: ${RECIPE_LLM_INPUT_USD_PER_MILLION:}
  output-usd-per-million: ${RECIPE_LLM_OUTPUT_USD_PER_MILLION:}
