# Профиль: local разработка (--spring.profiles.active=dev)
# Активирует: gRPC Reflection, детальное логирование, быстрый рестарт

spring:
  grpc:
    server:
      address: "127.0.0.1"          # локально — только loopback
      reflection:
        enabled: true               # grpcurl list / grpcurl describe — разрешено в dev
      shutdown-timeout: 0s          # мгновенный стоп для быстрого hot-reload

  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  liquibase:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans

  endpoint:
    health:
      show-details: always          # полный вывод деталей в dev

logging:
  level:
    root: INFO
    dev.andre.nutritionist: DEBUG
    org.springframework.grpc: DEBUG
    io.grpc: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    liquibase: INFO
