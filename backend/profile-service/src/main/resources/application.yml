profile:
  calories:
    enabled: ${PROFILE_CALORIES_ENABLED:true}
    topic: diary.entry.created
    group-id: profile-calories-v1
    dead-letter-topic: diary.entry.created.profile.dlt
    max-attempts: 4
    initial-backoff-ms: 1000
    max-backoff-ms: 10000
    dlt-partitions: 1
    dlt-replicas: 1
    dlt-outbox:
      poll-interval: PT1S
      max-attempts: 10

spring:
  application:
    name: profile-service

  # ── gRPC Server ──────────────────────────────────────────────────────────────
  grpc:
    server:
      address: "0.0.0.0"
      port: ${PROFILE_GRPC_PORT:9090}
      health:
        enabled: true
      # Таймаут graceful shutdown переопределяется в prod-профиле
      shutdown-timeout: 0s

  # ── Database ─────────────────────────────────────────────────────────────────
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/profile_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: ProfileServiceHikariPool
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: public

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      "[schema.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      "[http.connect.timeout.ms]": 2000
      "[http.read.timeout.ms]": 2000
      "[max.retries]": 0
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: profile-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        "[specific.avro.reader]": true
        "[isolation.level]": read_committed

  # ── Redis (Idempotency store & cache) ─────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Lifecycle (базовый graceful shutdown) ────────────────────────────────────
  lifecycle:
    timeout-per-shutdown-phase: 5s

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:8080}   # HTTP-порт для Actuator отдельно от gRPC

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never           # переопределяется в dev
      probes:
        enabled: true               # /actuator/health/liveness + /actuator/health/readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  # ── OpenTelemetry / Micrometer ──────────────────────────────────────────────
  tracing:
    sampling:
      probability: 1.0

# ── Logging (JSON — базовый шаблон) ──────────────────────────────────────────
logging:
  level:
    root: INFO
    dev.andre.nutritionist: INFO
  pattern:
    console: >-
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}",
       "level":"%level","service":"${spring.application.name}",
       "traceId":"%X{traceId}","spanId":"%X{spanId}",
       "userId":"%X{userId}","message":"%msg"}%n
