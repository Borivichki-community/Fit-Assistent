spring:
  application:
    name: profile-service

  # ── gRPC Server ──────────────────────────────────────────────────────────────
  grpc:
    server:
      address: "0.0.0.0"
      port: ${PROFILE_GRPC_PORT:9090}
      health:
        enabled: true
      # Таймаут graceful shutdown переопределяется в prod-профиле
      shutdown-timeout: 0s

  # ── Database ─────────────────────────────────────────────────────────────────
  datasource:
    url: ${PROFILE_DB_URL:jdbc:postgresql://localhost:5433/profile_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: ProfileServiceHikariPool
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: public

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      "[schema.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: profile-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        "[specific.avro.reader]": true

  # ── Redis (Idempotency store & cache) ─────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Lifecycle (базовый graceful shutdown) ────────────────────────────────────
  lifecycle:
    timeout-per-shutdown-phase: 5s

# ── Outbox ────────────────────────────────────────────────────────────────────
outbox:
  enabled: ${OUTBOX_ENABLED:true}
  polling-interval-ms: ${OUTBOX_POLLING_INTERVAL_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
  retry-backoff-ms: ${OUTBOX_RETRY_BACKOFF_MS:2000}
  failed-retry-interval-ms: ${OUTBOX_FAILED_RETRY_INTERVAL_MS:60000}
  cleanup:
    enabled: ${OUTBOX_CLEANUP_ENABLED:true}
    cron: "${OUTBOX_CLEANUP_CRON:0 0 3 * * ?}"
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:7}
    strategy: ${OUTBOX_CLEANUP_STRATEGY:BATCH}
    batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:1000}
    max-retries: ${OUTBOX_CLEANUP_MAX_RETRIES:3}
    retry-backoff-ms: ${OUTBOX_CLEANUP_RETRY_BACKOFF_MS:1000}

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      redis-idempotency:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: ${SERVER_PORT:8085}

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:8085}   # HTTP-порт для Actuator отдельно от gRPC

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never           # переопределяется в dev
      probes:
        enabled: true               # /actuator/health/liveness + /actuator/health/readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  # ── OpenTelemetry / Micrometer ──────────────────────────────────────────────
  tracing:
    sampling:
      probability: 1.0

# ── Logging (структурированное JSON-логирование через logback-spring.xml) ─────
logging:
  level:
    root: INFO
    dev.andre.nutritionist: INFO
