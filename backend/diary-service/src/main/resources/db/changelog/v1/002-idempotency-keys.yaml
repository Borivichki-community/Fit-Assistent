databaseChangeLog:
  - changeSet:
      id: 002-idempotency-keys
      author: team
      dbms: postgresql
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: rpc_method
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: response_bytes
                  type: BYTEA
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: idempotency_keys
            columnNames: user_id, rpc_method, idempotency_key
            constraintName: pk_idempotency_keys
        - createIndex:
            tableName: idempotency_keys
            indexName: idx_idempotency_keys_expires_at
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: idempotency_keys
