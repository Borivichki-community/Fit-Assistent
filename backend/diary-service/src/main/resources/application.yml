diary:
  clients:
    recipe:
      address: ${DIARY_RECIPE_ADDRESS:localhost:9194}
      plaintext: ${DIARY_RECIPE_PLAINTEXT:true}
      dev-bypass: ${DIARY_RECIPE_DEV_BYPASS:true}
      deadline: ${DIARY_RECIPE_DEADLINE:2s}
      breaker-window: ${DIARY_RECIPE_BREAKER_WINDOW:10}
      breaker-min-calls: ${DIARY_RECIPE_BREAKER_MIN_CALLS:5}
      breaker-open-for: ${DIARY_RECIPE_BREAKER_OPEN_FOR:30s}
  coach-access:
    cache-ttl: ${DIARY_COACH_ACCESS_CACHE_TTL:60s}
  outbox:
    enabled: ${DIARY_OUTBOX_ENABLED:true}
    transaction-id-prefix: ${DIARY_OUTBOX_TRANSACTION_PREFIX:diary-outbox-}
    poll-interval: PT1S
    batch-size: 100
    max-attempts: 10
    initial-backoff: PT1S
    max-backoff: PT5M
  kafka:
    registration:
      enabled: ${DIARY_REGISTRATION_CONSUMER_ENABLED:true}
      topic: user.registered
      partitions: 3
      replication-factor: 1
      retry-interval: PT1S
      retries: 2

spring:
  application:
    name: diary-service

  grpc:
    server:
      address: 127.0.0.1
      port: ${DIARY_GRPC_PORT:9093}
      health:
        enabled: true

  datasource:
    url: ${DIARY_DB_URL:jdbc:postgresql://localhost:5433/diary_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1500ms
      timeout: 1500ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      "[schema.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[max.block.ms]": 10000
        "[max.in.flight.requests.per.connection]": 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: diary-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        "[specific.avro.reader]": true
        "[isolation.level]": read_committed
    listener:
      ack-mode: manual_immediate

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
