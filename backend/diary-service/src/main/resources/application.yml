diary:
  kafka:
    registration:
      enabled: ${DIARY_REGISTRATION_CONSUMER_ENABLED:true}
      topic: user.registered
      partitions: 3
      replication-factor: 1
      retry-interval: PT1S
      retries: 2
  outbox:
    enabled: ${DIARY_OUTBOX_ENABLED:true}
    transaction-id-prefix: ${DIARY_OUTBOX_TRANSACTION_PREFIX:diary-outbox-}
    poll-interval: PT1S
    batch-size: 100
    max-attempts: 10
    initial-backoff: PT1S
    max-backoff: PT5M

spring:
  application:
    name: diary-service

  grpc:
    server:
      address: 127.0.0.1
      port: ${DIARY_GRPC_PORT:9093}
      health:
        enabled: true

  datasource:
    url: ${DIARY_DB_URL:jdbc:postgresql://localhost:5432/diary_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      "[schema.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
        "[max.block.ms]": 10000
        "[max.in.flight.requests.per.connection]": 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: diary-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        "[specific.avro.reader]": true
        "[isolation.level]": read_committed
    listener:
      ack-mode: manual_immediate
