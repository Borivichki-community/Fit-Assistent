version: v2
managed:
  enabled: true
  override:
    - file_option: java_multiple_files
      value: true
    # Устраняет конфликт: outer class "ProfileProto" == message "ProfileProto"
    - file_option: java_outer_classname
      value: ProfileOuterClass
      path: nutritionist/profile/v1/profile.proto
plugins:
  - remote: buf.build/protocolbuffers/java
    out: ../backend/profile-service/build/generated/sources/buf/java
  - remote: buf.build/grpc/java
    out: ../backend/profile-service/build/generated/sources/buf/grpc
