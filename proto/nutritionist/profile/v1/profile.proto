syntax = "proto3";

package com.budgetntr.profile.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.budgetntr.proto.profile.v1";
option java_multiple_files = true;
option kotlin_package = "com.budgetntr.proto.profile.v1";

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (ProfileProto);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileProto);
}

enum GenderProto {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

enum ActivityLevelProto {
  ACTIVITY_LEVEL_UNSPECIFIED = 0;
  ACTIVITY_LEVEL_SEDENTARY = 1;      // Сидячий образ жизни
  ACTIVITY_LEVEL_LIGHT = 2;          // Легкая активность (1-3 тренировки)
  ACTIVITY_LEVEL_MODERATE = 3;       // Умеренная (3-5 тренировок)
  ACTIVITY_LEVEL_VERY_ACTIVE = 4;    // Высокая (6-7 тренировок)
}

enum GoalTypeProto {
  GOAL_TYPE_UNSPECIFIED = 0;
  GOAL_TYPE_LOSE_WEIGHT = 1;         // Похудение
  GOAL_TYPE_MAINTAIN = 2;            // Поддержание
  GOAL_TYPE_GAIN_WEIGHT = 3;         // Набор массы
}

message NutritionGoalProto {
  int32 target_calories = 1;
  double target_proteins_grams = 2;
  double target_fats_grams = 3;
  double target_carbs_grams = 4;
  double target_weight_kg = 5;
}

message ProfileProto {
  string id = 1;
  string user_id = 2;
  int32 height_cm = 3;
  double weight_kg = 4;
  GenderProto gender = 5;
  ActivityLevelProto activity_level = 6;
  GoalTypeProto goal_type = 7;
  NutritionGoalProto nutrition_goal = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  int32 height_cm = 2;
  double weight_kg = 3;
  GenderProto gender = 4;
  ActivityLevelProto activity_level = 5;
  GoalTypeProto goal_type = 6;
  NutritionGoalProto nutrition_goal = 7;
}