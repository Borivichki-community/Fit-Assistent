syntax = "proto3";

package com.budgetntr.diary.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.budgetntr.proto.diary.v1";
option java_outer_classname = "DiaryOuterClass";

service DiaryService {
  rpc AddEntry(AddEntryRequest) returns (AddEntryResponse);
  rpc GetDailyEntries(GetDailyEntriesRequest) returns (GetDailyEntriesResponse);
  rpc DeleteMeal(DeleteMealRequest) returns (DeleteMealResponse);
  rpc GetRange(GetRangeRequest) returns (GetRangeResponse);
}

enum EntrySourceType {
  ENTRY_SOURCE_TYPE_UNSPECIFIED = 0;
  ENTRY_SOURCE_TYPE_PRODUCT = 1;
  ENTRY_SOURCE_TYPE_RECIPE = 2;
  ENTRY_SOURCE_TYPE_CUSTOM = 3;
}

message Money {
  int64 amount_minor = 1;
  string currency_code = 2;
}

message CostSnapshot {
  Money total = 1;
  Money unit_price = 2;
  optional int64 price_basis_milligrams = 3;
}

message NutritionSummary {
  int32 calories = 1;
  double proteins = 2;
  double fats = 3;
  double carbs = 4;
}

message AddEntryRequest {
  string entry_id = 1;
  string meal_type = 2;
  google.protobuf.Timestamp recorded_at = 3;
  EntrySourceType source_type = 4;
  optional string source_id = 5;
  string name_snapshot = 6;
  double weight_grams = 7;
  NutritionSummary nutrition = 8;
  CostSnapshot cost = 9;

  // Legacy-поля для обратной совместимости
  string food_item_id = 10 [deprecated = true];
  string food_name = 11 [deprecated = true];
  double quantity_grams = 12 [deprecated = true];
}

message AddEntryResponse {
  DiaryEntryItem entry = 1;
}

message GetDailyEntriesRequest {
  string date = 1;
  string time_zone = 2;
}

message GetDailyEntriesResponse {
  repeated DiaryEntryItem entries = 1;
  NutritionSummary daily_total = 2;
  repeated MealNutritionSummary meal_totals = 3;
}

message MealNutritionSummary {
  string meal_type = 1;
  NutritionSummary nutrition = 2;
}

message DiaryEntryItem {
  string id = 1;
  EntrySourceType source_type = 2;
  optional string source_id = 3;
  string name_snapshot = 4;
  double weight_grams = 5;
  NutritionSummary nutrition = 6;
  google.protobuf.Timestamp recorded_at = 7;
  string meal_type = 8;
  CostSnapshot cost = 9;

  // Legacy-поля для обратной совместимости
  string food_item_id = 10 [deprecated = true];
  string food_name = 11 [deprecated = true];
  double quantity_grams = 12 [deprecated = true];
}

message DiaryEntryProto {
  string id = 1;
  string food_item_id = 2;
  string food_name = 3;
  double quantity_grams = 4;
  NutritionSummary nutrition = 5;
  google.protobuf.Timestamp recorded_at = 6;
  string meal_type = 7;
  CostSnapshot cost = 8;
  EntrySourceType source_type = 9;
  optional string source_id = 10;
  string name_snapshot = 11;
  double weight_grams = 12;
}

message DeleteMealRequest {
  string entry_id = 1;
}

message DeleteMealResponse {}

message GetRangeRequest {
  string start_date = 1;
  string end_date = 2;
  string time_zone = 3;
}

message GetRangeResponse {
  repeated DiaryEntryItem entries = 1;
}
