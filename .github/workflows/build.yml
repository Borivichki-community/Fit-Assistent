name: CI — Build, Test & Verify

on:
  push:
    # Запускаем сборку при пуше в любые рабочие и релизные ветки
    branches: [ "master", "develop", "feature/**", "release/**" , "fix/**"]
  pull_request:
    # При PR в develop и main
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-verify:
    name: Proto Contracts (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.50.0"
          setup_only: true
      - name: Run buf lint
        run: |
          buf lint proto
      - name: Run buf breaking
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(find proto -name '*.proto' 2>/dev/null)" ]; then
            git branch -f "${{ github.base_ref }}" "origin/${{ github.base_ref }}" 2>/dev/null || git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"
            if git ls-tree -r "${{ github.base_ref }}" proto 2>/dev/null | grep -q '\.proto$'; then
              buf breaking proto --against ".git#branch=${{ github.base_ref }},subdir=proto"
            else
              echo "В базовой ветке ${{ github.base_ref }} пока нет .proto файлов. Пропуск buf breaking."
            fi
          fi

  mobile-verify:
    name: Mobile & KMP (Tests & APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run KMP Shared Tests
        run: ./gradlew :mobile:shared:allTests --no-daemon
      - name: Assemble Android Debug
        run: ./gradlew :mobile:androidApp:assembleDebug --no-daemon

  backend-verify:
    name: Backend (JUnit5 & Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Backend
        id: check_backend
        run: if [ -n "$(find backend -name 'build.gradle.kts' 2>/dev/null)" ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-java@v4
        if: steps.check_backend.outputs.exists == 'true'
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check_backend.outputs.exists == 'true'
      - name: Run Backend Tests
        if: steps.check_backend.outputs.exists == 'true'
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'