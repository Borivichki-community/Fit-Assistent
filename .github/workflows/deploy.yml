name: CD — Docker Build & Helm Deploy

on:
  # Запускается вручную из вкладки Actions в любой момент
  workflow_dispatch:
    inputs:
      environment:
        description: 'Целевое окружение для деплоя'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  # Автозапуск при пуше в master/main только когда реально изменился код бэкенда или K8s-чарты
  push:
    branches: [ "master", "main" ]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - 'infrastructure/k8s/**'

jobs:
  deploy:
    name: Build Images & Deploy to Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend services are ready for Docker build
        id: check_ready
        run: |
          if [ -n "$(find backend -name 'build.gradle.kts' 2>/dev/null)" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Микросервисы в папке backend/ пока не содержат build.gradle.kts. Пропускаем сборку Docker-образов и деплой."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_ready.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy status summary
        run: |
          echo "CD Pipeline checked successfully."