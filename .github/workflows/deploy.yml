name: CD — Docker Build & Helm Deploy

on:
  push:
    # Деплой запускается СТРОГО только при попадании кода в релизную ветку
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - 'infrastructure/k8s/**'
  workflow_dispatch: # Позволяет запустить деплой вручную кнопкой

jobs:
  deploy-to-cluster:
    name: Build Images & Deploy via Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Backend
        id: check_ready
        run: if [ -n "$(find backend -name 'build.gradle.kts' 2>/dev/null)" ]; then echo "ready=true" >> $GITHUB_OUTPUT; else echo "ready=false" >> $GITHUB_OUTPUT; fi

      - name: Log in to GHCR
        if: steps.check_ready.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Задел на будущее: здесь будет сборка docker build ... ---
      - name: Build Docker Images (Placeholder)
        if: steps.check_ready.outputs.ready == 'true'
        run: echo "Здесь будет сборка образов (например, профиль, каталог, дневник)"

      # --- Задел на будущее: здесь будет helm upgrade ... ---
      - name: Deploy via Helm
        if: steps.check_ready.outputs.ready == 'true'
        run: |
          echo "Здесь будет деплой Helm."
          echo "При релизе через cherry-pick мы будем применять обновлённую версию из Chart.yaml"

      - name: Deploy status summary
        run: echo "Deploy pipeline completed."