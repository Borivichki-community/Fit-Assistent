name: "AI QA - Trigger Google Jules on PR"

on:
  pull_request:
    # Запускаем ИИ только когда фичу хотят влить в develop
    branches: [ "develop" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  jules-qa-session:
    name: Start Jules QA & Test Generation
    runs-on: ubuntu-latest
    if: >
      !startsWith(github.head_ref, 'jules/') &&
      github.actor != 'google-jules[bot]'

    steps:
      - name: Check Jules API Key & Trigger Session
        id: trigger_jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          REPO_FULL_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::Секрет JULES_API_KEY не задан. Пропускаем Jules."
            echo "triggered=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PROMPT="Ты проводишь QA-ревью Pull Request #${PR_NUMBER}: «${PR_TITLE}» в ветку ${BASE_BRANCH}.
          Описание фичи: «${PR_BODY}»
          
          Твоя задача сфокусироваться СТРОГО на описанной фиче:
          1. Изучи изменённые файлы. Придумай краевые случаи ИМЕННО для этой фичи.
          2. Строго соблюдай правила из AGENTS.md и навыки из .agents/skills/. Никаких !! и java.* в KMP.
          3. Допиши тесты на найденные краевые случаи (используй Fake-реализации для KMP, Testcontainers для Backend) и создай Pull Request в ветку ${PR_BRANCH}."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            -d "$(jq -n \
              --arg title "QA Review: ${PR_TITLE}" \
              --arg prompt "$PROMPT" \
              --arg repo "sources/github/${REPO_FULL_NAME}" \
              --arg branch "$PR_BRANCH" \
              '{
                title: $title,
                prompt: $prompt,
                sourceContext: { source: $repo, githubRepoContext: { startingBranch:$branch } },
                automationMode: "AUTO_CREATE_PR"
              }')")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "session_name=$(echo "$RESPONSE" | sed '$d' \vert{} jq -r '.name')" >> $GITHUB_OUTPUT
            echo "triggered=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Ошибка $HTTP_CODE"
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.trigger_jules.outputs.triggered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Jules QA Agent запущен!**\nСессия: \`${{ steps.trigger_jules.outputs.session_name }}\`\nАгент изучает PR, придумывает краевые кейсы по вашему описанию и готовит тесты.`
            });