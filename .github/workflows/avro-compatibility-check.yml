name: Avro Schema Compatibility Check

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "shared/contracts/**"
      - ".github/workflows/avro-compatibility-check.yml"
      - "infrastructure/docker-compose.local.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "shared/contracts/**"
      - ".github/workflows/avro-compatibility-check.yml"
      - "infrastructure/docker-compose.local.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avro-compatibility-check:
    name: Verify Avro Schemas & BACKWARD Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start Kafka & Schema Registry Containers
        run: |
          docker compose -f infrastructure/docker-compose.local.yml up -d kafka schema-registry --wait

      - name: Verify Schema Registry Readiness
        run: |
          echo "Verifying Confluent Schema Registry readiness..."
          timeout 60s bash -c 'until curl -fsS http://localhost:8081/subjects; do sleep 2; done'
          echo "Schema Registry is healthy and ready!"

      - name: Set Global Schema Compatibility to BACKWARD
        run: |
          curl -X PUT \
            -H "Content-Type: application/vnd.schemaregistry.v1+json" \
            --data '{"compatibility": "BACKWARD"}' \
            http://localhost:8081/config
          echo "Schema Registry global compatibility configured to BACKWARD."

      - name: Run Avro Code Generation and Schema Compatibility Check
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
          REQUIRE_SCHEMA_REGISTRY: "true"
        run: ./gradlew :shared:contracts:generateAvroJava :shared:contracts:testSchemaCompatibility --stacktrace

      - name: Run Contracts Unit & Mapping Tests
        run: ./gradlew :shared:contracts:test --stacktrace

      - name: Stop Containers
        if: always()
        run: |
          docker compose -f infrastructure/docker-compose.local.yml stop kafka schema-registry
          docker compose -f infrastructure/docker-compose.local.yml rm -f -v kafka schema-registry
